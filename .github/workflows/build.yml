name: EMS Platform Build (Core + Client + Nebulous/Swarmchestrate Plugin)

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
      - "r*"
      - "test"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/imu-iccs

  EMS_CORE_REPO: https://github.com/IMU-ICCS/ems-main.git
  EMS_CORE_BRANCH: main

  EMS_NEBULOUS_REPO: https://github.com/IMU-ICCS/ems-nebulous-translator.git
  EMS_NEBULOUS_BRANCH: main

  EMS_CORE_BUILDER_IMAGE: ems-server-core-builder
  EMS_CORE_IMAGE: ems-server
  EMS_CLIENT_IMAGE: ems-client
  EMS_SWARMCHESTRATE_IMAGE: ems-server-swarmchestrate

  CORE_VERSION: 8.0.0-snapshot
  SWARMCHESTRATE_VERSION: 1.0.0-snapshot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout Plugin repo
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # 2. Versioning (sanitized)
      # -----------------------------
      - name: Compute versions
        id: ver
        run: |
          set -e

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_PLUGIN_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_PLUGIN_VERSION="snapshot-${GITHUB_SHA::7}"
          fi

          PLUGIN_VERSION=$(echo "$RAW_PLUGIN_VERSION" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9\.\-]/-/g')

          echo "plugin_version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=${CORE_VERSION}" >> $GITHUB_OUTPUT
          echo "swarmchestrate_version=${SWARMCHESTRATE_VERSION}" >> $GITHUB_OUTPUT

      # -----------------------------
      # 3. Pre-build validation
      # -----------------------------
      - name: Validate naming
        run: |
          set -e

          echo "${REGISTRY}" | grep -q '[A-Z]' && exit 1 || true
          echo "${{ steps.ver.outputs.plugin_version }}" | grep -q '[A-Z]' && exit 1 || true

      # -----------------------------
      # 4. Clone EMS server core
      # -----------------------------
      - name: Checkout EMS core
        run: |
          git clone --depth 1 --branch "${EMS_CORE_BRANCH}" "${EMS_CORE_REPO}" ems-main

      # -----------------------------
      # 5. Setup buildx (multi-arch)
      # -----------------------------
      - uses: docker/setup-buildx-action@v3

      # -----------------------------
      # 6. Build EMS core builder image
      # -----------------------------
      - name: EMS core builder
        run: |
          docker buildx build \
            -f ems-main/Dockerfile \
            --target ems-server-builder \
            -t ${EMS_CORE_BUILDER_IMAGE}:latest \
            ems-main \
            --load

      # -----------------------------
      # 7. Build EMS server core runtime image
      # -----------------------------
      - name: EMS server runtime
        run: |
          docker buildx build \
            -f ems-main/Dockerfile \
            --build-arg DOCKER_IMAGE=${REGISTRY}/${EMS_CORE_IMAGE}:${{ steps.ver.outputs.core_version }} \
            --build-arg BUILD_DESCR="Generated by Github CI" \
            --target ems-server \
            -t ${EMS_CORE_IMAGE}:${{ steps.ver.outputs.core_version }} \
            -t ${REGISTRY}/${EMS_CORE_IMAGE}:${{ steps.ver.outputs.core_version }} \
            -t ${REGISTRY}/${EMS_CORE_IMAGE}:latest \
            ems-main \
            --load

      # -----------------------------
      # 8. Build EMS client runtime image
      # -----------------------------
      - name: EMS client runtime
        run: |
          docker buildx build \
            -f ems-main/Dockerfile \
            --target ems-client \
            -t ${REGISTRY}/${EMS_CLIENT_IMAGE}:${{ steps.ver.outputs.core_version }} \
            -t ${REGISTRY}/${EMS_CLIENT_IMAGE}:latest \
            ems-main \
            --load

      # -----------------------------
      # 9. Clone EMS Nebulous plugin
      # -----------------------------
      - name: Checkout EMS Nebulous plugin
        run: |
          git clone --depth 1 --branch "${EMS_NEBULOUS_BRANCH}" "${EMS_NEBULOUS_REPO}" ems-nebulous-translator

      # -----------------------------
      # 10. Copy EMS Swarmchestrate files
      # -----------------------------
      - name: Copy EMS Swarmchestrate files
        run: |
          ls -l
          ls -l ems-swarmchestrate/
          ls -l ems-nebulous-translator/
          cp -r ems-swarmchestrate/src/main/. ems-nebulous-translator/ems-nebulous-translator/src/main/
          ls -l ems-nebulous-translator/src/main/java/eu

      # -----------------------------
      # 11. Build EMS server + Nebulous/Swarmchestrate translator runtime image
      # -----------------------------
      - name: EMS server + Nebulous/Swarmchestrate plugin
        run: |
          sed -i \
            -e 's|FROM \$EMS_CORE_BUILDER_IMAGE|FROM core_builder|' \
            -e 's|FROM \$EMS_CORE_IMAGE|FROM core|' \
            ems-nebulous-translator/Dockerfile
          
          docker buildx use default
          
          docker buildx build \
            --progress=plain \
            --build-context core=docker-image://${EMS_CORE_IMAGE}:${{ steps.ver.outputs.core_version }} \
            --build-context core_builder=docker-image://${EMS_CORE_BUILDER_IMAGE}:latest \
            --target ems-server-with-nebulous-translator \
            -t ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:${{ steps.ver.outputs.swarmchestrate_version }} \
            -t ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:${{ steps.ver.outputs.plugin_version }} \
            -t ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:latest \
            ems-nebulous-translator
            --load

      # -----------------------------
      # 12. Login (only before push)
      # -----------------------------
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # 13. Push everything (final step only)
      # -----------------------------
      - name: Push all images
        run: |
          set -e
          docker push ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:${{ steps.ver.outputs.plugin_version }}
          docker push ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:${{ steps.ver.outputs.swarmchestrate_version }}
          docker push ${REGISTRY}/${SWARMCHESTRATE_IMAGE}:latest