name: EMS Swarmchestrate Translator Plugin Build

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
      - "r*"
      - "test"
  repository_dispatch:
    types: [core-published]
  workflow_dispatch: {}

concurrency:
  group: ems-swarmchestrate-workflow
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/imu-iccs
  CORE_VERSION: 8.0.0-snapshot
  SWARMCHESTRATE_VERSION: 1.1.0-snapshot

jobs:

  # ---------------------------------------------------
  # 1. Resolve exact core image digests to build against
  # ---------------------------------------------------
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      server_ref: ${{ steps.resolve.outputs.server_ref }}
      builder_ref: ${{ steps.resolve.outputs.builder_ref }}

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve core image digests
        id: resolve
        run: |
          set -euo pipefail

          SERVER_IMAGE="${REGISTRY}/ems-server:${CORE_VERSION}"
          BUILDER_IMAGE="${REGISTRY}/ems-server-core-builder:${CORE_VERSION}"

          echo "Checking $SERVER_IMAGE ..."
          SERVER_DIGEST=$(docker buildx imagetools inspect "$SERVER_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Checking $BUILDER_IMAGE ..."
          BUILDER_DIGEST=$(docker buildx imagetools inspect "$BUILDER_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')

          if [ -z "$SERVER_DIGEST" ] || [ "$SERVER_DIGEST" = "null" ]; then
            echo "ERROR: could not resolve digest for $SERVER_IMAGE"
            exit 1
          fi
          if [ -z "$BUILDER_DIGEST" ] || [ "$BUILDER_DIGEST" = "null" ]; then
            echo "ERROR: could not resolve digest for $BUILDER_IMAGE"
            exit 1
          fi

          echo "server_ref=${REGISTRY}/ems-server@${SERVER_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "builder_ref=${REGISTRY}/ems-server-core-builder@${BUILDER_DIGEST}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------
  # 2. Collect metadata
  # ---------------------------------------------------
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      safe_time: ${{ steps.meta.outputs.safe_time }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          COMMIT_DATE=$(git show -s --format=%cI HEAD)
          SAFE_TIME=$(date -u -d "$COMMIT_DATE" +"%Y%m%dT%H%M%SZ")
          echo "safe_time=$SAFE_TIME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------
  # 3. Build plugin image per platform (parallel matrix)
  # ---------------------------------------------------
  build:
    needs: [preflight, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-24.04-arm     # native arm64 - no QEMU
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        run: |
          export REGISTRY="${{ env.REGISTRY }}"
          export BANNER_IMAGE="${REGISTRY}/ems-server-swarmchestrate:${{ env.SWARMCHESTRATE_VERSION }}"
          export BANNER_DESCR="Plugin generated by Github CI"
          export COMMIT_SHA="${{ needs.metadata.outputs.commit_sha }}"
          export COMMIT_SAFE_TIME="${{ needs.metadata.outputs.safe_time }}"
          export PLATFORM="${{ matrix.platform }}"
          export ARCH_TAG="${{ matrix.arch_tag }}"
          export CORE_SERVER_REF="${{ needs.preflight.outputs.server_ref }}"
          export CORE_BUILDER_REF="${{ needs.preflight.outputs.builder_ref }}"

          docker buildx bake --push

  # ---------------------------------------------------
  # 4. Merge per-arch images into multi-platform manifests
  # ---------------------------------------------------
  merge:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -eux

          REGISTRY="${{ env.REGISTRY }}"
          BANNER_IMAGE="${REGISTRY}/ems-server-swarmchestrate:${{ env.SWARMCHESTRATE_VERSION }}"
          BANNER_DESCR="Plugin generated by Github CI"
          COMMIT_SHA="${{ needs.metadata.outputs.commit_sha }}"
          COMMIT_SAFE_TIME="${{ needs.metadata.outputs.safe_time }}"

          SRC_AMD64="${REGISTRY}/ems-server-swarmchestrate:${COMMIT_SHA}-amd64"
          SRC_ARM64="${REGISTRY}/ems-server-swarmchestrate:${COMMIT_SHA}-arm64"

          docker buildx imagetools create \
            -t "${REGISTRY}/ems-server-swarmchestrate:${SWARMCHESTRATE_VERSION}" \
            -t "${REGISTRY}/ems-server-swarmchestrate:latest" \
            -t "${REGISTRY}/ems-server-swarmchestrate:${COMMIT_SHA}" \
            -t "${REGISTRY}/ems-server-swarmchestrate:${COMMIT_SHA}-${COMMIT_SAFE_TIME}" \
            "${SRC_AMD64}" "${SRC_ARM64}"
